title: "Training curves: a minimal PyTorch loop, three planted bugs, and the stability threshold"
title_zh: "训练曲线：最小训练循环、三处 bug 和学习率阈值"
summary_zh: "先用 PyTorch 写一个最小的训练循环，画训练和验证曲线，并解释训练曲线为什么一直高于验证曲线（dropout 的精确恒等式）；再读同事的训练脚本，根据曲线和几行测量找出三处 bug；最后对线性模型手推梯度、用有限差分核对，再用 Hessian 的最大特征值预测学习率的稳定阈值，画出阈值上下三条损失曲线。"
category: coding
kind_zh: "编程 · PyTorch、线性代数与画图"
roles: [RS, RE]
topics: [pytorch, training-loop, debugging, dropout, finite-differences, learning-rate, hessian, plotting]
difficulty: medium
frequency: low
