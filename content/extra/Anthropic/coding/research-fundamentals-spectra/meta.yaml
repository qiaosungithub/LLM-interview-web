origin: "Anthropic 面试流程汇总里研究岗位那一段说，第一轮技术面是从几种形式里选一种，其中一种是“ML research fundamentals”，即用 PyTorch 写代码、带一点线性代数和画图，没有记录任何具体题目；这道题是我们按这句描述补写的，真实面试不一定问这些内容。"
