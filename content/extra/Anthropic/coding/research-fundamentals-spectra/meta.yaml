title: "Spectra and convergence rates: PCA by SVD, power iteration, gradient descent"
title_zh: "谱与收敛速度：PCA、幂迭代和梯度下降"
summary_zh: "给一份协方差谱已知的数据：用 SVD 做 PCA 并和特征分解对照；写幂迭代，用特征值之比预测误差直线的斜率；用 PyTorch 对最小二乘做梯度下降，在对数坐标上画出每个特征方向各自的衰减，再用条件数算出要走多少步。每张图都要先说出形状再画。"
