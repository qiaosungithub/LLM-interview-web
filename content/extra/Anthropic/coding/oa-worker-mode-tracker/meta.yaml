title: "Online Assessment: Worker Mode Tracker"
title_zh: "在线测评：多 worker 众数统计"
summary_zh: "分四关实现一个汇总类：多个 worker 各自上报整数；随时查询全局出现次数最多的值和前 k 名；移除一个 worker 时把它上报过的数据全部抹掉；合并两个 worker。追问里用带懒删除的堆把众数查询做到平摊 O(log V)。"
category: coding
kind_zh: "在线测评 · 4 关"
roles: [SWE, MLE, RE]
topics: [oop-design, hash-map, counting, mode, lazy-deletion-heap]
difficulty: medium
