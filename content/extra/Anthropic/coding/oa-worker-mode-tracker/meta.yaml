added: true
origin: "证据很薄：一份第三方备考清单（一个付费课程的宣传页）在“CodeSignal OA Questions”下列了“Worker Mode Tracker”，只有三条要点：Collect data from multiple worker shards；Track most frequent values globally；Support worker removal (erase historical contributions)。没有接口、例子和分关方式，也不是真实测评的原题。本页第 1 到 3 关各对应一条要点，接口、并列规则和例子都是这次定的；第 4 关（合并 worker）在来源里没有对应内容，是这次补的。"
