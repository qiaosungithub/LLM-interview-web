title: "Online Assessment: Bank System with Instant Transfers, Cashback and Merges"
title_zh: "在线测评：银行系统（即时转账、返现与合并）"
summary_zh: "银行系统题的另一套四关：开户、存款与即时转账；按支出总额排行；付款后 24 小时到账的 2% 返现与付款状态；合并账户（未到账的返现转给存下来的账户）并查询过去某一时刻的余额。"
category: coding
kind_zh: "在线测评 · 4 关"
roles: [SWE, MLE, RE]
