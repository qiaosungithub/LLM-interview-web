added: true
origin: "银行系统这类四关在线测评在收集到的面经里多次出现，本站已有另一套关卡。这一套（即时转账、支出排行、付款与 24 小时后的 2% 返现、合并与历史余额）取自两个公开的 CodeSignal 风格练习集：LibreSignal 和 Fellowship Trainer 里的银行四关模拟题，两者都说明自己是练习用的模拟题，都不是经过确认的 Anthropic 原题；网上一份 Anthropic 面试整理清单把“银行账本”列为在线测评题，也只有三行要点（开户、存款和转账；24 小时后到账的返现；余额历史和支出排行），没有题面。题面、例子和参考解答是重写的。来源有几处要自己定：LibreSignal 的第 2 关和第 4 关各有一张例子表数字前后对不上，本页的验证代码里按规则改正；被合并掉的账户能不能查历史余额，两份来源的参考实现各不相同，本页定为“看 time_at 那一刻这个账户在不在”。"
