origin: "依据只有一句话：第三方面试指南 interviewing.io 的 Anthropic 页面说，编程轮偏好 first-principles、build-from-scratch，候选人用标准库把题解干净之后，可能被要求从零实现数据结构，并要为复杂度辩护、处理边界情况。它没有点名任何具体的数据结构，也没有给题目。选哈希表、四个部分的分法、所有规则、例子和验证代码都是我们补写的。"
