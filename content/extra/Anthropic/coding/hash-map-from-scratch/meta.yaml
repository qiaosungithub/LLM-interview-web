title: "Hash Map from Scratch"
title_zh: "从零实现哈希表"
summary_zh: "不用 dict 和 set，用开放寻址加线性探测实现一个哈希表：插入、查找和扩容，正确的删除，遍历，最后支持调用方自己提供哈希函数和相等判断。每一步都要说清代价是期望、最坏还是均摊。"
summary: "Without dict or set, implement a hash map with open addressing and linear probing: insertion, lookup and growth, correct deletion, iteration, and finally support for caller-supplied hash and equality functions. At every step, say whether each cost is expected, worst case, or amortized."
