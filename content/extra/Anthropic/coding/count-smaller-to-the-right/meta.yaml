title: "Count Smaller to the Right"
title_zh: "右侧更小元素的个数"
summary_zh: "对数组里的每个元素，数出它右边有多少个严格更小的元素：先写暴力解并算清代价，再用归并排序和树状数组各写一个 O(n log n) 的解法，并说清两者各适合什么场合。"
summary: "For each element of an array, count how many strictly smaller elements lie to its right: write the brute force first and work out its cost, then write one O(n log n) solution with merge sort and one with a Fenwick tree, and explain when each is the better fit."
