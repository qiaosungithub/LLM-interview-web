origin: "题名来自一份第三方面经汇总（网上一份带课程广告的 “Anthropic Coding & System Design Interview Prep Guide”），它在电面题里列了 “Count Smaller to the Right”，全部内容只有三句：数每个元素右侧更小的元素、要优于 O(n²) 的暴力解、用归并排序做到 O(n log n)。完整题面、重复元素的约定、树状数组和流式计数的 Part 3、所有例子和验证代码都是我们补写的。"
