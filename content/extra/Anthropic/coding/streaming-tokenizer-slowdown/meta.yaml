title: "Streaming Tokenizer That Slows Down on Long Documents"
title_zh: "流式分词器在长文档上越跑越慢"
summary_zh: "给你一段输出正确、但文档越长每个 token 越慢的流式最长匹配分词代码和一个复现脚本：先说清怎样定位时间花在哪里，再在不改变任何输出的前提下把总工作量降到线性，最后让它在两个线程间安全使用并限制积压。"
summary: "You are given streaming greedy longest-match tokenizer code whose output is correct but which gets slower per token the longer the document is, plus a repro script: first explain how to find where the time goes, then bring the total work down to linear without changing any output, and finally make it safe to use from two threads with a bounded backlog."
