title: "Indexed Priority Queue from Scratch"
title_zh: "从零实现堆和带索引的优先队列"
summary_zh: "不用 heapq，先写一个二叉堆，再扩展成能按键修改优先级、按键删除的带索引优先队列，最后用它写 Dijkstra，并和“懒删除”的写法比较堆的大小和复杂度。"
summary: "Without heapq, write a binary heap, extend it into an indexed priority queue that can change priorities and remove by key, then use it to write Dijkstra, and compare heap size and complexity with the lazy-deletion approach."
category: coding
kind_zh: "编程 · 从零实现数据结构"
kind: "Coding · Data structures from scratch"
roles: [SWE, MLE, RE]
topics: [binary-heap, indexed-priority-queue, decrease-key, dijkstra, lazy-deletion, complexity-analysis]
difficulty: medium
frequency: low
stage: [phone-screen, onsite]
format_zh: "3 个部分 / 60 分钟"
format: "3 parts / 60 minutes"
