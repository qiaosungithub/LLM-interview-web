origin: "InterviewDB（Reddit 帖）、csoahelp、VOprep、FastPrep 几家商业备考网站都说 Anthropic Fellows 的在线测评里有一道题，要修好一份有若干 bug 的 Extra-Trees 实现：Reddit 帖和 csoahelp 说是第二轮测评，csoahelp 的标题写着 60 分钟；csoahelp 和 VOprep 贴出的题面基本相同，要求修好 trees.py、让 test_trees.py 全部通过（csoahelp 的题面还说不要把向量化的 NumPy 代码改成循环）；FastPrep 只有一行题名和简介。csoahelp 和 VOprep 留的联系方式相同，不是独立来源；各家对能否上网搜索说法也不一致（Reddit 帖说只能查文档，csoahelp 和 VOprep 说可以搜索）；真题代码没有公开，本页的代码、bug、测试和第 2 部分都是补写的。"
