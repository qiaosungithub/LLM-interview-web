origin: "证据只有一份第三方材料（interviewing.io 的 Anthropic 面试指南）：它说用人经理电话有时会让候选人读几种不同语言的代码示例，说出代码在做什么并找出问题；材料没有给出任何具体代码。这一页的三段代码和全部问题都是我们补写的，真实面试不一定问这些。"
