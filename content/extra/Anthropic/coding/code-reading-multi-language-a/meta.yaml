title: "Code reading in several languages (A): C, JavaScript, SQL"
title_zh: "读代码：三段代码，三种语言（A 卷：C / JavaScript / SQL）"
summary_zh: "不写代码，只读代码：一段 C、一段 JavaScript、一段 SQL，各约 30 行。讲清楚每段想做什么、实际输出什么、哪里有错、怎么改、想问作者什么。"
