title: "Black-Box Probing of an LLM Through Its API: Why Does Long Addition Fail?"
title_zh: "只靠 API 研究模型行为：多位数加法为什么会错"
summary_zh: "5 小时研究型 take-home：只能通过 API 调用模型，3,000 次调用以内，弄清多位数加法的错误由什么决定，给出能定量预测的解释，并在没见过的数据上检验它。本页用一个埋了规律的模拟模型代替真实 API。"
summary: "A 5-hour research take-home: you can reach the model only through an API, within 3,000 calls; find out what determines its errors on multi-digit addition, give an explanation that makes quantitative predictions, and test it on data it has not seen. This page replaces the real API with a simulated model that has a pattern planted in it."
