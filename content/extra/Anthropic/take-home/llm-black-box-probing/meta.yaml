origin: "证据有两条，都没有给出具体题目：一位 2025 年 Research Fellowship 候选人的博客说，流程里有一个 5 小时的 take-home，他意外收到过题目链接，是一个 Jupyter Notebook，对方给 Anthropic API 的 key，让他把系统当成黑盒去试探，最后在通话里讲解自己的方案；一条只看得到摘要的 Glassdoor 反馈说，技术面是在一个简单的小任务上评估 LLM。这一页的研究问题、模拟模型和参考解答都是我们补写的，真实题目不一定是这样。"
