origin: "证据有两条，都没有给出具体题目：一条 Glassdoor 反馈只能看到标题，说 Research Engineer/Scientist 的技术面试是评估 LLM 在一个简单小任务上的表现，并用 LLM 为这个任务生成额外数据（没说是不是 take-home）；一位 2025 年 Research Fellowship 候选人的博客说，5 小时 take-home 是一个 Jupyter Notebook，给 Anthropic API 的 key，最后在通话里讲解方案。这一页的小任务、模拟 API、埋下的陷阱和参考解答都是我们补写的，真实题目不一定是这样。"
