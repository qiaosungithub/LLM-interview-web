title: "Evaluating LLMs on a Toy Task, Then Testing LLM-Generated Data"
title_zh: "小任务上评估 LLM，再用 LLM 造数据：生成的数据到底有没有用"
summary_zh: "5 小时研究型 take-home：在括号配平这个小任务上评估两个模型，再让模型生成带标签的例子，先检查数据质量，再判断它们当作少样本示例是否真的有帮助。题里埋了几个做评估时常见的坑。本页用一个模拟 API 代替真实模型。"
summary: "A 5-hour research take-home: evaluate two models on the toy task of bracket balancing, then have a model generate labeled examples, check the data quality first, and judge whether they actually help as few-shot examples. Several common evaluation pitfalls are built into the problem. This page uses a simulated API in place of real models."
