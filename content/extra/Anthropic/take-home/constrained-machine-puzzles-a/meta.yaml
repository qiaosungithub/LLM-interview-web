title: "Constrained-Machine Puzzles (A): A Guarded Accumulator Machine"
title_zh: "Take-home：受限指令集谜题（一）带条件前缀的累加器机"
summary_zh: "一台只有两个寄存器、一个标志位、10 条指令、程序首尾成环的小机器，配一份只判断对错和条数的检查器。5 道独立小题，按总指令数计分：要自己写跟踪器，把状态藏进标志位和条件前缀，再用穷举搜索证明解已经最短。"
summary: "A tiny machine with just two registers, one flag and 10 instructions, whose program wraps around into a ring, plus a checker that reports only validity and instruction count. Five independent puzzles scored by total instruction count: write your own tracer, hide state in the flag and the guards, and use exhaustive search to prove your solutions are already the shortest."
