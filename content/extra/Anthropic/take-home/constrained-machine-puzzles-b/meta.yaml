origin: "证据是 Anthropic 官网的一篇工程文章（2026 年 1 月，作者是性能优化团队的负责人之一，讲怎样设计不怕 AI 的技术考核）：现在的性能 take-home 是一组在很小、限制很多的指令集上做的谜题，以最少指令数为目标，灵感来自 Zachtronics 游戏；不提供可视化和调试工具，起始代码只检查答案是否有效，自己做调试工具是考察的一部分；由多个独立小题组成。真实的谜题和指令集没有公开，这一页的队列机、4 道题、计分细节和参考解答都是我们自己设计的；2 小时时限沿用旧版 take-home 的说法；新版的时限原文没有明说，只提到设计时担心新题难到人在两小时内做不完。"
