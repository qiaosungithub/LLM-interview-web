title: "Constrained-Machine Puzzles (B): A Machine With Only a Queue"
title_zh: "Take-home：受限指令集谜题（二）只有一条队列的机器"
summary_zh: "一台没有寄存器、所有数据都在一条先进先出队列里的小机器，减法截断在 0，指令要的数不够时直接停机。4 道独立小题按总指令数计分：用截断减法的恒等式代替比较和分支，按队列顺序摆操作数，用不变量数个数，把\"饿死\"当成出口。"
category: take-home
kind_zh: "Take-home · 受限指令集谜题"
