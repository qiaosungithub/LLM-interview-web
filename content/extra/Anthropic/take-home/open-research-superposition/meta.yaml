title: "72-Hour Open Research Take-Home: When Does a Small Model Store More Features Than It Has Dimensions?"
title_zh: "72 小时开放研究：小模型什么时候能存下比维度更多的特征"
summary_zh: "约 72 小时的开放研究 take-home，题目只有一句话：隐藏层只有 m 维的小模型，什么时候会表示多于 m 个特征（叠加），由什么控制。参考解答示范怎样把问题收窄、怎样安排三天，并给出一个 CPU 上就能跑完的核心实验：稀疏度从 0 升到 0.98，ReLU 模型存下的特征从 5 个增加到 14 个左右，线性对照始终是 5 个；再用一个“反向配对”的成本收益模型预测特征数，并指出它在哪里不成立。"
summary: "An open-ended research take-home of about 72 hours, with a one-sentence prompt: when does a small model whose hidden layer has only m dimensions represent more than m features (superposition), and what controls it? The reference solution shows how to narrow the question and plan the three days, and gives a core experiment that runs to completion on a CPU: as sparsity rises from 0 to 0.98, the ReLU model goes from storing 5 features to about 14, while the linear control stays at 5; it then uses an \"antipodal pair\" cost-benefit model to predict the feature count, and points out where that model breaks down."
