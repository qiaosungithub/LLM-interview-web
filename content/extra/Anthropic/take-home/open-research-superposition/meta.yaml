origin: "Anthropic 面试流程汇总里的候选人反馈只说：研究岗的流程里有 4 小时的探索性 ML take-home，有些团队还有 72 小时的研究 take-home，内容因团队而异；没有记下任何具体题目；这道以叠加为主题的开放题、评审要求和参考解答都是我们补写的。"
