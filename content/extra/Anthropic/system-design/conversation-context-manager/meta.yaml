origin: "第三方面试指南（Landed 整理的 Anthropic 面试指南，自称汇总自 Glassdoor、Blind、Reddit 和候选人博客）在系统设计题单里列了一句“Design a conversation context manager”，这一条注明的出处是另一个面试准备网站；指南后文只附了一行简短的答题要点（滚动窗口加语义压缩、跨设备的对话线程、确定性的压缩、按需摘要等）。另一份第三方指南（interviewing.io）列了相近的一句“Design a system that enables a GPT to handle multiple questions in a single thread”。两处都没有题目细节，这类指南之间可能互相引用同一来源。题目里的流量、token 数、价格等数字和整份解答都是我们补写的练习假设，不是真实面试原题，也不是 Anthropic 的真实数据。"
