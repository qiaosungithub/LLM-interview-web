title: "Design a Conversation Context Manager"
title_zh: "设计对话上下文管理器"
summary_zh: "给一个上下文窗口有限的聊天产品设计上下文管理：对话的数据模型（分支、附件、工具结果），在 token 预算内组装提示词，压缩策略和它们的失败方式，提示词缓存为什么要求前缀稳定，以及同一个对话里并发发送、多设备一致、留存与删除。"
summary: "Design context management for a chat product with a limited context window: the conversation data model (branches, attachments, tool results), assembling the prompt within a token budget, compaction strategies and how they fail, why prompt caching requires a stable prefix, and concurrent sends within one conversation, multi-device consistency, retention and deletion."
category: system-design
kind_zh: "系统设计"
kind: "System design"
roles: [SWE, MLE, Infra Eng]
topics: [context-window, prompt-assembly, compaction, prompt-caching, token-counting, concurrency, multi-device-sync, retention-deletion]
difficulty: hard
frequency: low
stage: [onsite]
