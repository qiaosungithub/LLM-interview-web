origin: "第三方面试指南（Landed 整理的 Anthropic 面试指南，自称汇总自 Glassdoor、Blind、Reddit 和候选人博客）在系统设计题单里列了一句“Design a system to detect harmful outputs”，这一条注明的出处是另一个面试准备网站；指南后文只附了一行简短的答题要点（越狱检测器、内容政策分类器、持续红队评估、人工复核被标记的内容等），没有题目细节。这类指南之间可能互相引用同一来源。题目里的流量、基准率、分类器指标等数字和整份解答都是我们补写的练习假设，不是真实面试原题，也不是 Anthropic 的真实数据。"
