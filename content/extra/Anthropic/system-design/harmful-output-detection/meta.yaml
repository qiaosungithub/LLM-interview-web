title: "Design a System to Detect Harmful Outputs"
title_zh: "设计有害输出检测系统"
summary_zh: "给一个大语言模型的 API 和聊天产品设计有害输出的检测与处置：检查放在请求路径的哪里、流式输出怎么拦、级联分类器在极低基准率下的召回与审核量怎么算，以及评估、申诉、跨请求滥用检测和隐私留存。"
summary: "Design detection and handling of harmful outputs for an LLM API and chat product: where the checks go in the request path, how to intercept streamed output, how to compute recall and review volume for a classifier cascade at a very low base rate, plus evaluation, appeals, cross-request abuse detection, and privacy and retention."
