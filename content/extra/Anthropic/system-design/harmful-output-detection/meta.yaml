kind_zh: "系统设计"
kind: "System design"
roles: [SWE, MLE, Infra Eng]
topics: [content-moderation, classifier-cascade, base-rate, streaming-guardrails, human-review, abuse-detection, evaluation-drift, privacy-retention]
difficulty: hard
