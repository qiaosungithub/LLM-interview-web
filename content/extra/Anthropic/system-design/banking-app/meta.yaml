title: "Design a Banking App"
title_zh: "设计一个银行 App"
summary_zh: "设计银行 App 的后端：复式记账的不可变账本，用幂等键让转账只生效一次，用哪种隔离级别和机制分别防住丢失更新与写偏斜，跨分片转账选两阶段提交还是 saga，冻结与入账，读到自己的写，以及对账、审计和留存。"
summary: "Design the backend of a banking app: an immutable double-entry ledger, idempotency keys so a transfer takes effect only once, which isolation level and mechanism prevent lost updates and write skew respectively, two-phase commit or a saga for cross-shard transfers, holds and captures, read-your-writes, and reconciliation, audit and retention."
category: system-design
kind_zh: "系统设计"
kind: "System design"
roles: [SWE, Infra Eng]
topics: [ledger, double-entry, idempotency, isolation-levels, write-skew, two-phase-commit, sagas, reconciliation]
difficulty: hard
frequency: low
stage: [onsite]
