origin: "第三方面试指南 interviewing.io 的 Anthropic 页面在系统设计题里只列了一句“Design a banking app”，没有细节；另一份第三方指南（Landed 整理，自称汇总自 Glassdoor、Blind、Reddit 和候选人博客）在编程题里列了“为银行 App 实现有多种交易类型的核心业务逻辑”，站内对应 OA 银行系统题。这些指南可能互相引用同一来源。题目里的用户数、流量、延迟和留存期限等数字以及整份解答都是我们补写的练习假设，不是真实面试原题，也不描述任何公司的真实系统。"
