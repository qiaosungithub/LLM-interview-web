origin: "证据只有流程页里的两句话：性能和基础设施岗位的专项轮里有一场“网络排障角色扮演”（network-debugging role play），一位性能工程候选人的候选人门户也把它列在现场面里；没有任何报告记录过具体场景、时长或评分方式。这里的场景、数字和命令输出全部是补写的：输出格式对照本机的 tcpdump、ping、mtr、curl、ss 核对过，数值不是实测；内核行为对照 Linux 源码和 ip-sysctl 文档核对（2026-11-18）。"
