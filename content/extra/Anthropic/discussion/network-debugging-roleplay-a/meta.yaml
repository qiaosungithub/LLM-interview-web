title: "Network Debugging Role Play A: Intermittent Connection Resets on Reused Connections"
title_zh: "网络排障角色扮演 A：复用的连接偶尔被重置"
summary_zh: "面试官扮演值班同事，你主导排查：一个跑在 AWS 私有子网里的服务调外部支付接口，约 0.3% 的请求立刻报 “Connection reset by peer”，重试就好。8 步从缩小范围、按连接空闲时长分组、逐行读 tcpdump、确认 NAT 网关的 350 秒空闲超时，到“明明开了 keepalive 为什么没用”、今晚的修复（套接字级 TCP keepalive、只重试幂等请求）、长期修复（各层空闲超时怎么排、不同厂商的默认值、悄悄丢包的变体）和怎么更早发现。"
summary: "The interviewer plays an on-call colleague and you lead the investigation: a service in a private AWS subnet calls an external payment API, and about 0.3% of requests fail immediately with \"Connection reset by peer\" but succeed on retry. Eight steps: narrowing the scope, grouping by connection idle time, reading tcpdump line by line, confirming the NAT gateway's 350-second idle timeout, \"why didn't keepalive help when it was turned on\", tonight's fix (socket-level TCP keepalive, retrying only idempotent requests), the long-term fix (how to order idle timeouts across layers, vendor defaults, the silent-drop variant) and how to catch it earlier."
category: discussion
