title: "Research Brainstorm: Is the Chain-of-Thought the Real Reason, and Why a High Benchmark Score Does Not Feel Better"
title_zh: "研究头脑风暴：思维链是不是真实理由，基准分数高为什么不好用"
summary_zh: "15 分钟、两道开放题的研究头脑风暴练习，每题带三个追问。第一题：只能用 API，怎么检验模型写出来的推理（思维链）是不是它得出答案的真实原因（暗示注入实验、对照组、截断结果怎么解读、为什么做安全的人在意）。第二题：公开基准分数很高，用户却说不好用，可能是什么原因，怎么用最便宜的实验区分数据污染和题目变难。每问都写了强回答该覆盖什么、常见的丢分点。"
summary: "A 15-minute research-brainstorm exercise with two open questions, each with three follow-ups. Question 1: with API access only, how do you test whether the reasoning a model writes out (its chain-of-thought) is the real reason it reached its answer (hint-injection experiments, control groups, how to read truncation results, why safety researchers care). Question 2: a public benchmark score is very high but users say the model is not better in practice; what could explain it, and what is the cheapest experiment that separates data contamination from the rewritten questions being harder. Each question spells out what a strong answer should cover and the common ways to lose points."
