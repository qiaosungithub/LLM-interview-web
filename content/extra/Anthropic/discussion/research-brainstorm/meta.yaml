origin: "唯一的证据是一篇候选人博客（faillearnrepeat.net，2025 年 2 月，申请的是研究 Fellowship）：虚拟现场面里有一场 15 分钟的研究头脑风暴，对方是对齐方向的负责人，简短介绍后问了两个开放题，作者说不需要 LLM 的内部知识，只要把模型当黑盒观察过的经验和一点创意，具体题目和评分方式都没有记录；这里的两道题、六个追问、所有数字和参考答案都是补写的，引用的论文结论于 2026-11-18 对照 arXiv 摘要核对。"
