title: "Classic Reinforcement Learning: MDPs, TD Learning, Bandits and Off-Policy Evaluation"
title_zh: "经典强化学习：MDP、时序差分、老虎机与离策略评估"
summary_zh: "13 个口头小题：在一个两状态 MDP 上解贝尔曼方程、做策略改进、数值迭代要几轮；算 SARSA、Q-learning、Expected SARSA 的一步更新；比较蒙特卡洛与 TD；算 UCB1 指标、汤普森采样的选臂概率和遗憾的增长速度；算重要性采样的偏差和方差；解释致命三要素和基于势函数的奖励塑形。每个数字都有可运行的核对。"
summary: "13 short oral questions: solve the Bellman equations on a two-state MDP, do policy improvement, and count value-iteration sweeps; compute one-step updates for SARSA, Q-learning and Expected SARSA; compare Monte Carlo with TD; compute the UCB1 index, Thompson sampling's arm-selection probability and how fast regret grows; compute the bias and variance of importance sampling; explain the deadly triad and potential-based reward shaping. Every number has a runnable check."
