origin: "根据流程页的记录整理：2020–2021 年研究实习的一小时技术面抽查“数学、机器学习、强化学习和读代码”；大约 2022 年以前的小测验大多是本科考试的难度，其中一场 2022 年研究科学家小测验的第二位面试官问了强化学习。面经里没有留下 MDP、时序差分、老虎机这类经典强化学习的具体题目（提到过的“PPO 和 GRPO 有什么区别”属于大模型强化学习），这 13 问是按这个范围和难度补写的，不是真题。"
