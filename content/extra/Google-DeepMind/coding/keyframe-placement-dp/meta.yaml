origin: "Google DeepMind 面试流程汇总里，有一份反馈说软件工程和 Gemini 应用岗位的编程轮是 LeetCode 中等难度、考“dynamic programming and backtracking”，另一段提到过“标准题之后接一道建立在候选人自己代码上的组合数学题”；两处都没有记录具体题目，这道关键帧动态规划题是按这个题型补写的，真实面试不一定考过它。"
