title: "Keyframe Placement: Minimum Cost Under Gap Limits, and Counting Optimal Plans"
title_zh: "关键帧放置：间隔受限的最小代价与最优方案计数"
summary_zh: "在一段视频里选关键帧：首尾必选、相邻关键帧的间隔不超过 G，求最小费用；再加上“两个长间隔不能相邻”，状态要多带一位；最后在同一份代码上数出最优方案的个数（对 1e9+7 取模）。"
summary: "Choose keyframes in a video: the first and last frames are mandatory and consecutive keyframes may be at most G apart; find the minimum cost. Then add \"no two long gaps in a row\", which needs one more bit of state. Finally, on the same code, count the optimal plans (modulo 1e9+7)."
