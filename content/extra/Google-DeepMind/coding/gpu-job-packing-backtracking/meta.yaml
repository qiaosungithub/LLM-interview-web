title: "Packing Training Jobs onto GPUs: Search Order, Pruning and Branch and Bound"
title_zh: "把训练作业分到 GPU 上：回溯的搜索顺序、剪枝与分支限界"
summary_zh: "把 n 个作业放到 k 块显存相同的 GPU 上：先用回溯找一个合法方案；再靠“先放大的作业”和“占用相同的 GPU 只试一块”两种剪枝，把访问的节点数降几个数量级；最后用分支限界求最忙那块 GPU 的最小占用。"
category: coding
kind_zh: "编程 · 回溯与剪枝"
roles: [SWE, MLE, RE]
topics: [backtracking, pruning, symmetry-breaking, branch-and-bound, search-order, memoization]
difficulty: medium
frequency: low
