origin: "Google DeepMind 面试流程汇总里，有一份反馈说软件工程和 Gemini 应用岗位的编程轮是 LeetCode 中等难度、考“dynamic programming and backtracking”，没有记录具体题目；这道 GPU 装箱回溯题是按这个题型补写的，真实面试不一定考过它。"
