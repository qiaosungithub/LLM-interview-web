title: "Skip List: a Sorted Multiset with Order Statistics"
title_zh: "跳表：有序多重集合与按名次查询"
summary_zh: "用跳表（skip list）从零实现一个允许重复键的有序集合：插入、查找、删除、范围查询，再给每个指针加上跨度，支持“第 k 小”和“比它小的有几个”。每个操作要求期望 O(log n)，追问集中在它和排序数组、平衡树之间的取舍。"
