origin: "Google DeepMind 面试流程汇总的 take-home 一节只有一句：一位战略与运营岗位的候选人准备并讲了一次关于 DeepMind 近期成果的报告，而且只有这一份反馈；时长、听众和评分方式都没有记录。这里的 9 个问题、12 分钟的设定和两次练习（Genie 4、AlphaProof Code）全部是补写的，练习里的事实取自 2026-11-17 下载的官方材料。"
