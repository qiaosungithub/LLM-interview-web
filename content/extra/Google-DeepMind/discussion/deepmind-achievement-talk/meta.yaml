title: "Presenting a Recent DeepMind Achievement: Preparation and Two Worked Exercises"
title_zh: "讲一项 DeepMind 近期成果：演讲准备与两次练习"
summary_zh: "流程页记录过一次这样的考法，出现在战略与运营（strategy and operations）岗位：准备并讲一项 DeepMind 近期成果。这一页先练选题、12 分钟结构和追问清单，再用 Genie 4 和 AlphaProof Code 各练一次提纲和两个最难的追问。研究岗被问到“你觉得 DeepMind 近期哪项工作最有意思，为什么”时，同一套准备也用得上。"
summary: "The process page records this format once, for a strategy and operations role: prepare and present a recent DeepMind achievement. This page first practices choosing a topic, a 12-minute structure and a list of follow-up questions, then works through an outline and the two hardest follow-ups once each for Genie 4 and AlphaProof Code. The same preparation also works when a research candidate is asked \"Which recent DeepMind work do you find most interesting, and why?\""
