origin: "Google DeepMind 流程页记录了一场 Gemini 应用团队的机器学习软件工程师面试（走 Google 的招聘渠道），用人经理轮问了“怎么跨领域评估一个多任务系统”和“没有更多数据时怎么改进模型”，只有这一份报告、只有这两句；Q1 和 Q5 是这两题，其余 6 个追问、所有数字和参考答案都是补写的。"
