origin: "Google DeepMind 面试流程汇总里，对技术项目经理（TPM）只有一句话：先是一个简短的招聘联系人初筛，然后是一场考察技术深度和干系人管理的用人经理面，并注明项目管理类岗位的证据还比较少。没有记录任何原题，这里的 12 道题全部是按这句描述补写的。"
