summary_zh: "两组共 12 道题，练 TPM 用人经理面的两个考察方向：把一个机器学习系统讲清楚并指出真正的风险；在自己没有决定权的情况下处理算力冲突、发布分歧、延期上报和对上级说“不”。"
summary: "Twelve questions in two groups, practicing the two things a TPM hiring-manager round tests: explaining an ML system clearly and pointing out the real risk; and handling compute conflicts, launch disagreements, escalating a delay, and saying \"no\" to senior people when the decision isn't yours."
