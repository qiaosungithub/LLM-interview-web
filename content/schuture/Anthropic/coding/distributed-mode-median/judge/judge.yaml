case_cpu: 2
note: "十个 rank 跑在线程上模拟，通信量按每次 send 的 len(pickle.dumps(obj)) 字节统计，O(·) 界按固定常数检查：Part 1 最忙的 rank 接收 ≤ 4·H/P + 2000（H 是十个本地直方图各 pickle 一次的总字节数），Part 2 发送总量 ≤ 100·P·(log₂R + 1)，Part 3 每个 rank 收发各 ≤ 4·W/P + 2000（W 是整个数据集 pickle 成一个列表的字节数），题面豁免的倾斜数据只查结果。自定义运行里可以 from ref import Cluster，用 Cluster().run(fn, shards) 跑十个 rank。"
