timeout: 46
case_cpu: 2
special: concurrency
note: "每个用例在 tempfile.mkdtemp() 里现建目录树，用完即删；不可读文件用 chmod 000 制造，“列出之后、读取之前被删掉”的文件在它第一次被打开前删除；硬链接不测。Part 2 的读取量通过替换 open、io.open、os.open、os.read、os.pread 按文件统计；mmap.mmap 只记映射了多少字节，从映射里读了多少看不到（io.FileIO、os.readv 等绕过它们的读取不计）：所有文件大小互不相同时必须读 0 字节、不能映射任何文件；大小独一无二、或与同样大小的文件第一个字节就不同的文件不能被完整读取（大小独一无二的文件也不能被整个映射）。Part 3 在每次打开文件前随机等待几毫秒来打乱完成顺序，并检查哈希确实是并发的（几个 300 KB 左右的同样大小的文件；测试让每次打开最多等 0.5 秒，为完整哈希打开文件时必须有另一个文件也在被打开——一个文件的唯一一次打开、或第二次及以后的打开算作完整哈希）；use_processes=True 用 2 和 3 个 worker 测试。通过不代表没有竞态条件。自定义运行里可以 from ref import make_tree 重建失败用例里的目录树。"
