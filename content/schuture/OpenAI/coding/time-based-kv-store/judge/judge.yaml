# Limits for this problem's judge; see tools/JUDGE_BRIEF.md.
special: concurrency
note: "Part 1、Part 2 的测试既接受按 Part 1/2 规则、也接受已按 Part 3 规则（时间戳严格递增）写的 TimeMap，只要同一项测试里前后一致；Part 4 会从多个线程同时调用，并在查字典、比较时间戳、读时钟的地方插入暂停点让竞态复现，死锁表现为超时（TLE）。但并发测试只能发现问题，不能证明没有问题：全部通过不代表没有竞态条件；题目里两种加锁策略的比较和读写锁的讨论不评测。"
timeout: 50       # seconds for the whole run: the case limits add up to 45
case_cpu: 1       # CPU seconds per case unless the case says otherwise
