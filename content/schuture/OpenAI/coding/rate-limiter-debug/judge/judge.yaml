timeout: 120
case_cpu: 2
special: concurrency
note: "只评测修好之后的代码（RateLimiter 和 rate_limited），找出问题、解释原因的书面部分不评测。测试用自己的假时钟逐次调用，和题目的定义逐一比对；并发测试把 checkpoint 换成一道闸，让判断之后、记录之前的调用在里面等，只要像原代码那样在判断和记录之间调用 checkpoint，没有锁住两者的写法每次都会被抓到；另有一个测试让每个线程每执行一行代码都先停一下，用来暴露没有放在同一次持锁里的「先查看、再动作」。并发测试只能发现问题，不能证明没有问题：全部通过不代表代码里没有竞态条件。"
